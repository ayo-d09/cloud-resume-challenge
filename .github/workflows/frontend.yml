name: Deploy Portfolio to AWS

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::243768737939:role/github-actions-cloud-resume-challenge
          aws-region: us-east-1

      - name: Upload website to S3
        run: |
          aws s3 sync ./frontend/ s3://ayo-portfolio-site-12345 \
            --delete \
            --exclude "*.DS_Store"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E1SO7UQ83Q90P \
            --paths "/*"